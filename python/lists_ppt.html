<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #525659;
        }
        object {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <object 
        data="lists_theory.pdf#toolbar=0&navpanes=0&scrollbar=1" 
        type="application/pdf">
    </object>

</body>
</html>
