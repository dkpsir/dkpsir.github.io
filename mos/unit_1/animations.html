<title>Strength of Materials – Unit 1 Interactive Animations</title>
<style>
*{box-sizing:border-box}
:root{
  --navy:#071a2b;--navy2:#103b5c;--cyan:#22c7d6;
  --text:#17324d;--muted:#6f8291;--line:#d8e4ec;
}
body{
  margin:0;padding:20px 10px 40px;font-family:"Segoe UI",Arial,sans-serif;color:var(--text);
  background:
    linear-gradient(rgba(12,46,72,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(12,46,72,.035) 1px,transparent 1px),
    linear-gradient(135deg,#eef5f8,#f9fbfd 52%,#edf5f8);
  background-size:28px 28px,28px 28px,auto;
}
.page{
  width:min(1550px,96vw);margin:auto;background:#fff;border-radius:20px;
  overflow:hidden;box-shadow:0 18px 45px rgba(7,26,43,.13);
  border:1px solid rgba(16,59,92,.10);
}

.header-nav{
  position:absolute;top:24px;right:30px;
  display:flex;flex-direction:column;align-items:flex-end;gap:7px;
  z-index:3;
}
.header-nav a{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:142px;padding:7px 12px;
  border:1px solid rgba(159,234,240,.28);
  border-radius:8px;background:rgba(255,255,255,.075);
  color:#def9fb;text-decoration:none;font-size:12px;font-weight:800;
}
.header-nav a:hover{
  background:rgba(34,199,214,.16);
  border-color:rgba(159,234,240,.55);
}
@media(max-width:650px){
  .header-nav{position:static;align-items:flex-start;margin-top:15px}
}

.header{
  padding:28px 30px 26px;color:#fff;
  background:
    radial-gradient(circle at 88% 8%,rgba(34,199,214,.20),transparent 30%),
    linear-gradient(135deg,var(--navy),var(--navy2));
  position:relative;
}
.header:after{
  content:"";position:absolute;left:30px;right:30px;bottom:0;height:3px;
  background:linear-gradient(90deg,var(--cyan),#66dbeb,transparent)
}
.kicker{
  text-transform:uppercase;letter-spacing:1.5px;font-size:11px;
  font-weight:800;color:#a5edf2;margin-bottom:8px
}
h1{margin:0;font-size:clamp(25px,3.2vw,36px);line-height:1.15}
.header p{margin:9px 0 0;color:#c9dce7;font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.legend span{
  border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);
  border-radius:999px;padding:6px 10px;font-size:11px;color:#e8f8fb
}
.content{padding:18px 20px 22px}
.card{
  border:1px solid var(--line);border-radius:15px;margin-bottom:14px;
  overflow:hidden;background:#fff;box-shadow:0 8px 20px rgba(16,59,92,.055)
}
.card-head{
  display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;
  user-select:none;background:linear-gradient(180deg,#fff,#f8fbfd)
}
.badge{
  width:34px;height:34px;display:grid;place-items:center;border-radius:10px;
  color:#fff;font-weight:900;font-size:14px;flex:0 0 34px;
}
.card-title{font-size:16px;font-weight:850;flex:1;color:#15344f}
.plus{
  width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  font-size:22px;line-height:1;background:#eef5f8;color:#2a5d7e;
  transition:transform .25s,background .25s
}
.card.open .plus{transform:rotate(45deg);background:#dff8fb;color:#0b5367}
.card-body{display:none;border-top:1px solid var(--line);padding:16px;background:#fbfdfe}
.card.open .card-body{display:block}

/* Single-animation topics: always horizontal on normal screens. */
.single-layout{
  display:grid;
  grid-template-columns:minmax(0,2.05fr) minmax(300px,.95fr);
  gap:16px;
  align-items:stretch;
}
.animation-box{
  border:1px solid #d6e3eb;border-radius:13px;background:#fff;overflow:hidden;
  min-width:0;box-shadow:0 6px 16px rgba(16,59,92,.05)
}
.animation-box iframe{
  width:100%;border:0;display:block;background:#fff;
}
.info{
  border:1px solid #d6e3eb;border-radius:13px;background:#fff;padding:19px;
  position:relative;overflow:hidden;
}
.info:before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)
}
.info-kicker{
  text-transform:uppercase;letter-spacing:1.1px;font-weight:900;font-size:11px;
  color:#6b8191;margin-bottom:9px
}
.info h3{margin:0 0 10px;font-size:19px;color:#143a58}
.info p{margin:0 0 18px;color:#51697c;line-height:1.6;font-size:14px}
.formula{
  background:#f5fbfd;border:1px solid #d8edf1;border-radius:10px;
  padding:14px 12px;text-align:center;font-family:Georgia,"Times New Roman",serif;
  font-size:21px;color:#102f46;line-height:1.5
}
.formula-label{
  font-family:"Segoe UI",Arial,sans-serif;font-size:10px;font-weight:900;
  letter-spacing:1.2px;text-transform:uppercase;color:#507083;margin-bottom:6px
}
.multi-info{
  display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px
}
.multi-info .info{min-height:160px}
.footer{padding:18px 20px 24px;text-align:center;color:#718493;font-size:12px}

@media(max-width:900px){
  .single-layout{grid-template-columns:1fr}
  .multi-info{grid-template-columns:1fr}
}
@media(max-width:650px){
  body{padding:14px 8px}
  .content{padding:12px}
  .header{padding:22px 18px}
}
</style>
</head>

function decodeBase64ToUtf8(b64){
  const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  return new TextDecoder("utf-8").decode(bytes);
}

function createCard(item){
  const card=document.createElement("section");
  card.className="card";
  card.style.setProperty("--accent",item.accent);

  const head=document.createElement("div");
  head.className="card-head";
  head.innerHTML=`
    <div class="badge" style="background:${item.accent}">${item.n}</div>
    <div class="card-title">${item.title}</div>
    <div class="plus">+</div>`;

  const body=document.createElement("div");
  body.className="card-body";

  const iframe=document.createElement("iframe");
  iframe.title=item.title;
  iframe.loading="lazy";
  iframe.style.height=(item.single ? Math.max(610,item.height) : item.height)+"px";
  iframe.srcdoc=decodeBase64ToUtf8(item.srcdoc);

  const animationBox=document.createElement("div");
  animationBox.className="animation-box";
  animationBox.appendChild(iframe);

  if(item.n<=4){
    const layout=document.createElement("div");
    layout.className="single-layout";

    const info=document.createElement("aside");
    info.className="info";
    info.innerHTML=`
      <div class="info-kicker">Concept ${item.n}</div>
      <h3>${item.title}</h3>
      <p>${item.description}</p>
      <div class="formula">
        <div class="formula-label">Key relation</div>
        ${item.formula}
      </div>`;

    layout.append(animationBox,info);
    body.appendChild(layout);
  }else{
    const infoGrid=document.createElement("div");
    infoGrid.className="multi-info";

    const desc=document.createElement("div");
    desc.className="info";
    desc.innerHTML=`
      <div class="info-kicker">What students see</div>
      <h3>${item.title}</h3>
      <p>${item.description}</p>`;

    const formula=document.createElement("div");
    formula.className="info";
    formula.innerHTML=`
      <div class="info-kicker">Key relation</div>
      <div class="formula">${item.formula}</div>`;

    infoGrid.append(desc,formula);
    body.append(infoGrid,animationBox);
  }

  head.addEventListener("click",()=>card.classList.toggle("open"));
  card.append(head,body);
  return card;
}

DATA.forEach(item=>document.getElementById("cards").appendChild(createCard(item)));
</script>
</body>
</html>
