    // ==========================================
    // 2. LOGIC: POPULATE DROPDOWNS & RENDER
    // ==========================================
    
    const yearSelect = document.getElementById('gate-year');
    const mainSelect = document.getElementById('main-section');
    const subSelect = document.getElementById('sub-section');
    const showBtn = document.getElementById('show-btn');
    const container = document.getElementById('questions-container');

    // Populate Main Dropdown (No 'All' option as requested)
    let firstMainSet = false;
    Object.keys(sectionMap).forEach(main => {
        const opt = document.createElement('option');
        opt.value = main;
        opt.textContent = main;
        mainSelect.appendChild(opt);
        
        // Trigger population of sub-sections for the first item
        if(!firstMainSet) {
            populateSubSections(main);
            firstMainSet = true;
        }
    });

    function populateSubSections(mainValue) {
        subSelect.innerHTML = '<option value="all">All Sub Sections</option>';
        if (sectionMap[mainValue]) {
            sectionMap[mainValue].forEach(sub => {
                const opt = document.createElement('option');
                opt.value = sub;
                opt.textContent = sub;
                subSelect.appendChild(opt);
            });
        }
    }

    // Handle Main Dropdown Change
    mainSelect.addEventListener('change', function() {
        populateSubSections(this.value);
    });

    // Render Questions on Click
    showBtn.addEventListener('click', function() {
        const selectedYear = yearSelect.value;
        const selectedMain = mainSelect.value;
        const selectedSub = subSelect.value;
        
        container.innerHTML = ''; // Clear container
        
        const filteredQs = questionData.filter(q => {
            const matchYear = (selectedYear === 'all' || q.year === selectedYear);
            const matchMain = (q.main === selectedMain);
            const matchSub = (selectedSub === 'all' || q.sub === selectedSub);
            return matchYear && matchMain && matchSub;
        });

        if (filteredQs.length === 0) {
            container.innerHTML = '<div class="no-data">No questions found for this selection. Try adjusting your filters.</div>';
            return;
        }

        // Sort by Q.No to ensure they appear in order
        filteredQs.sort((a, b) => a.qno - b.qno);


        filteredQs.forEach((q, index) => {
            // Build Options HTML
            let optionsHTML = '';
            if (q.options && q.options.length > 0) {
                optionsHTML = '<ol class="opts">';
                q.options.forEach(opt => {
                    optionsHTML += `<li>${opt}</li>`;
                });
                optionsHTML += '</ol>';
            }

            // Build Image HTML
            let imageHTML = '';
            if (q.image) {
                imageHTML = `<div class="fig"><img src="images/${q.image}" alt="Reference Figure for Q${index + 1}"></div>`;
            }

            // Replace Q.X prefix from text if it exists so we can standardize it
            let cleanText = q.text.replace(/^Q\.\d+\s*/, '');

            // Build Question Card
            const qBox = document.createElement('div');
            qBox.className = 'q-box';
            qBox.innerHTML = `
                <div class="q-meta">
                    <span class="badge">${q.main} &gt; ${q.sub}</span>
                    <span class="gate-year">GATE ${q.year}</span>
                </div>
                <div class="q-header">
                    <div class="q-text">Q. ${index + 1} &nbsp;&nbsp;&nbsp; ${cleanText}</div>
                </div>
                ${imageHTML}
                ${optionsHTML}
                <button class="show-sol-btn">Show Solution</button>
                <div class="solution-wrapper">
                    <div class="ans">${q.ans}</div>
                    <div class="sol">${q.sol}</div>
                </div>
            `;
            container.appendChild(qBox);
        });

        // Add Toggle Event Listeners to new buttons
        document.querySelectorAll('.show-sol-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const wrapper = this.closest('.q-box').querySelector('.solution-wrapper');
                if (wrapper.style.display === 'block') {
                    wrapper.style.display = 'none';
                    this.textContent = 'Show Solution';
                    this.classList.remove('active');
                } else {
                    wrapper.style.display = 'block';
                    this.textContent = 'Hide Solution';
                    this.classList.add('active');
                }
            });
        });

        // Trigger MathJax to re-render equations in the dynamically added HTML
        if (window.MathJax) {
            MathJax.typesetPromise();
        }
    });
    
    
</script>
