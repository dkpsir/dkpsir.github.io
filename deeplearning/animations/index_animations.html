<style>
*{box-sizing:border-box}
body{
  margin:0;

  background:#eef8fd;
  color:#173b70;
}
.header{
  background:linear-gradient(135deg,#8ed8f5,#dff6ff);
  border-bottom:4px solid #e53935;
  padding:22px 18px;
  text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}

  margin:0;
  font-size:32px;

  color:#123d72;
}
.header p{
  margin:6px 0 0;
  color:#456b87;
  font-size:14px;
}
.container{
  max-width:1450px;
  margin:22px auto;
  padding:0 18px 30px;
}
.topic{
  background:white;
  border:1px solid #b9d9e9;
  border-left:6px solid #e53935;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 3px 10px rgba(27,90,130,.12);
}
.topicHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px 18px;
  cursor:pointer;
  user-select:none;
  background:linear-gradient(90deg,#dff6ff,#ffffff);
}
.topicHeader:hover{background:#d2f1fc}
.topicTitle{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:20px;
  font-weight:700;
  color:#173b70;
}
.number{
  background:#e53935;
  color:#fff;
  width:31px;
  height:31px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
}
.plus{
  width:31px;
  height:31px;
  border:2px solid #e53935;
  color:#e53935;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:700;
  line-height:1;
  transition:.25s;
}
.topic.open .plus{transform:rotate(45deg);background:#e53935;color:#fff}
.content{
  display:none;
  padding:12px;
  background:#f8fcff;
  border-top:1px solid #c8e4f1;
}
.topic.open .content{display:block}
iframe{
  width:100%;
  height:760px;
  border:1px solid #b7d5e5;
  border-radius:8px;
  background:#fff;
}
.hint{
  text-align:center;
  font-size:12px;
  color:#6a879b;
  margin:12px 0 0;
}
</style>
</head>
