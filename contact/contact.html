<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #eaf4ff, #f5f0ff);
            color: #222;
        }

        .card {
            width: 90%;
            max-width: 650px;

            background: #ffffff;

            padding: 55px 50px;

            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 12px 35px rgba(0, 70, 140, 0.15);

            border-top: 7px solid #1769aa;
        }

        .icon {
            width: 75px;
            height: 75px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #e3f2fd;

            font-size: 38px;
        }

        h1 {
            font-size: 2.4rem;
            color: #123b63;

            margin-bottom: 12px;

            font-weight: 700;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #666;

            line-height: 1.6;

            margin-bottom: 32px;
        }

        .mail-label {
            font-size: 1rem;
            color: #777;

            margin-bottom: 8px;
        }

        .email {
            display: inline-block;

            padding: 14px 28px;

            border-radius: 10px;

            background: #f0f7ff;

            border: 2px solid #b9d8f5;

            color: #075ea8;

            font-family: Georgia, "Times New Roman", serif;

            font-size: 1.45rem;

            font-weight: 600;

            letter-spacing: 0.5px;

            margin-bottom: 35px;
        }

        .back-link {
            display: inline-block;

            padding: 12px 28px;

            background: #1769aa;

            color: white;

            text-decoration: none;

            border-radius: 8px;

            font-size: 1rem;

            font-weight: 600;

            transition: 0.2s ease;
        }

        .back-link:hover {
            background: #0d4f82;

            transform: translateY(-2px);
        }

        .footer-text {
            margin-top: 28px;

            font-size: 0.85rem;

            color: #999;
        }

        @media (max-width: 600px) {

            .card {
                padding: 40px 25px;
            }

            h1 {
                font-size: 2rem;
            }

            .email {
                font-size: 1.15rem;
                padding: 12px 18px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="icon">
            ✉
        </div>

        <h1>Get in Touch</h1>

        <p class="subtitle">
            If you have any questions or inquiries,
            feel free to contact me.
        </p>

        <div class="mail-label">
            Mail to
        </div>

        <div class="email">
            dkpsir@gmail.com
        </div>

        <br>

        <a href="../index.html" class="back-link">
            ← Back to Home
        </a>

        <div class="footer-text">
            Academic &amp; Educational Resources
        </div>

    </div>

</body>
</html>
